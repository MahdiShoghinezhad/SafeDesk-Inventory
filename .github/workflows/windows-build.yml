name: Windows build and smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF application
        run: dotnet build src/SafeDeskInventory.App/SafeDeskInventory.App.csproj --configuration Release
      - name: Run core smoke checks
        run: dotnet run --project tests/SafeDeskInventory.Tests/SafeDeskInventory.Tests.csproj --configuration Release
      - name: Publish Windows app
        run: dotnet publish src/SafeDeskInventory.App/SafeDeskInventory.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: safedesk-win-x64
          path: publish/win-x64/
